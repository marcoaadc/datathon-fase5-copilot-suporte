[project]
name = "supportcopilot"
version = "1.0.0"
description = "Copilot de suporte hibrido: triagem de chamados (scikit-learn + MLflow), RAG sobre manuais em PDF (LangChain + FAISS) com guardrails, deteccao de drift (Evidently) e protecao de dados pessoais (LGPD)"
authors = [{ name = "Marco", email = "marcoaadc@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
# Dependencias de runtime da API. O que so o treino e o relatorio de drift usam (MLflow, Evidently)
# fica no grupo "pipelines", fora da imagem Docker.
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "numpy (>=1.26,<2.3)",
    "pandas (>=2.2,<3.0)",
    "scikit-learn (>=1.5,<1.8)",
    "joblib (>=1.4,<2.0)",
    "prometheus-client (>=0.20,<1.0)",
    "langchain-core (>=0.3,<2.0)",
    "langchain-community (>=0.3,<1.0)",
    "langchain-text-splitters (>=0.3,<2.0)",
    "langchain-openai (>=0.2,<2.0)",
    "langchain-google-genai (>=2.0,<5.0)",
    "faiss-cpu (>=1.8,<2.0)",
    "pypdf (>=5.0,<7.0)",
    "fastembed (>=0.4,<1.0)",
    "rank-bm25 (>=0.2.2,<0.3)",
]

[tool.poetry]
packages = [{ include = "supportcopilot", from = "src" }]

[tool.poetry.group.pipelines.dependencies]
mlflow = ">=3.1,<4.0"
evidently = ">=0.7.11,<0.8"
pyarrow = ">=25.0.1,<26"
fpdf2 = ">=2.8,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
httpx = ">=0.27,<1.0"
ruff = ">=0.6"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "models", "reports", "mlruns", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Catalogo de expressoes regulares: quebrar as linhas atrapalha a leitura dos padroes.
"src/supportcopilot/guardrails/rules.py" = ["E501"]
"src/supportcopilot/guardrails/engine.py" = ["E501"]
"tests/*" = ["S101", "S105", "S106", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["supportcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes que carregam o modelo de embeddings ou geram relatorios reais (mais lentos)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/supportcopilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
