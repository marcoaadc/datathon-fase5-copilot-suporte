version: 2
updates:
  # Bumps de versao maior exigem revisao manual: so minor/patch automaticos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "build"
    groups:
      api:
        patterns: ["fastapi", "uvicorn", "pydantic*", "prometheus-client"]
      modeling:
        patterns: ["pandas", "numpy", "scikit-learn", "joblib", "pyarrow"]
      rag:
        patterns: ["langchain*", "faiss-cpu", "fastembed", "pypdf", "rank-bm25"]
      tracking-and-monitoring:
        patterns: ["mlflow", "evidently"]
      dev:
        patterns: ["pytest*", "ruff", "pre-commit", "httpx"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "build"
